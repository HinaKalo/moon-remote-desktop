[package]
name = "moonrd-session"
description = "Transport-independent session layer: message framing, SPAKE2 authentication with the host PIN, lockout and pairing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moonrd-proto = { path = "../moonrd-proto" }
prost = "0.14"
spake2 = "0.4"
argon2 = "0.5"
base64 = "0.23"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
