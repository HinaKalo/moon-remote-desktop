[package]
name = "moonrd-transport"
description = "QUIC transport between native peers (over EasyTier or the LAN), authenticated with the devices' Ed25519 keys as TLS raw public keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moonrd-proto = { path = "../moonrd-proto" }
moonrd-session = { path = "../moonrd-session" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["io-util", "sync", "time", "macros", "rt"] }
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
